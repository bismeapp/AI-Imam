services:
  - type: web
    name: ai-imam-bisme-radio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MANUS_API_URL
        sync: false
      - key: MANUS_API_KEY
        sync: false
